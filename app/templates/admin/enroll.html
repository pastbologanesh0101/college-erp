{% extends "base.html" %}
{% block title %}Enroll student{% endblock %}
{% block content %}
  <h1>Enroll a student in a course</h1>
  <div class="card">
    <form class="stacked" method="post">
      <label for="student_id">Student</label>
      <select id="student_id" name="student_id" required>
        {% for student in students %}
          <option value="{{ student.id }}">{{ student.roll_number }} &mdash; {{ student.name }}</option>
        {% endfor %}
      </select>

      <label for="course_id">Course</label>
      <select id="course_id" name="course_id" required>
        {% for course in courses %}
          <option value="{{ course.id }}">{{ course.code }} &mdash; {{ course.title }}</option>
        {% endfor %}
      </select>

      <label for="semester">Semester</label>
      <input id="semester" name="semester" placeholder="e.g. 2026-Fall" required>

      <button type="submit">Enroll</button>
    </form>
  </div>
{% endblock %}
